<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'"><title>桌宠电脑操作测试</title><style>
*{box-sizing:border-box}body{margin:0;padding:30px 42px;background:#fff8f0;color:#5a2e14;font:16px "Microsoft YaHei UI",sans-serif}h1{font-size:25px;margin:0 0 8px}p{font-size:13px;line-height:1.8;margin:8px 0 22px;color:#946f52}.counter{display:flex;align-items:center;gap:24px;padding:20px 0}#count{font-size:54px;font-weight:bold;min-width:80px}button{background:#f07a2a;border:0;border-radius:12px;padding:16px 32px;color:white;font:700 18px "Microsoft YaHei UI",sans-serif;cursor:pointer}label{display:block;margin:22px 0 10px;font-weight:700}input{display:block;width:100%;font:20px "Microsoft YaHei UI",sans-serif;padding:15px;border:2px solid #f0d9c4;border-radius:12px;background:white;color:#5a2e14}#preview{padding:12px 0;font-size:16px;overflow-wrap:anywhere}small{font-size:12px;color:#946f52}
</style></head><body><h1>电脑操作测试</h1><p>这是本机的独立测试窗口，不连接任何第三方账号，也不修改你的文件。<br>可以测试点击“加一”和输入文字。</p><div class="counter"><span>当前计数</span><strong id="count">0</strong><button id="add">加一</button></div><label for="text">测试输入框</label><input id="text" placeholder="让桌宠在这里输入文字" autocomplete="off"><div id="preview">输入预览：（空）</div><small>模型只有看到界面变化后，才能报告任务完成。</small><script>document.querySelector('#add').onclick=()=>{document.querySelector('#count').textContent=String(Number(document.querySelector('#count').textContent)+1)};document.querySelector('#text').oninput=e=>{document.querySelector('#preview').textContent='输入预览：'+(e.target.value||'（空）')};</script></body></html>
